<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="footerNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3">
        <animate attributeName="stop-color" values="#00ffa3;#00e5ff;#9d4edd;#00ffa3" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#9d4edd;#00ffa3;#00e5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9d4edd">
        <animate attributeName="stop-color" values="#9d4edd;#00ffa3;#00e5ff;#9d4edd" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="fGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="150" fill="#04060d"/>
  
  <line x1="50" y1="20" x2="1150" y2="20" stroke="#0f2334" stroke-width="1.5"/>
  <circle cx="600" cy="20" r="3" fill="#00ffa3"/>

  <!-- Core Message -->
  <text x="600" y="78" text-anchor="middle" font-size="23" font-weight="900"
        fill="url(#footerNeon)" filter="url(#fGlow)" letter-spacing="5">AUTONOMY // REASONING // INFINITE SCALE</text>

  <!-- Terminal Status -->
  <text x="600" y="114" text-anchor="middle" font-size="13.5" fill="#587992" letter-spacing="2">
    rajan@aiwithrajan:~$ status: <tspan fill="#00ffa3">neural_systems_operational</tspan><tspan fill="#00e5ff" dx="4">&#9608;<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan>
  </text>
</svg>
