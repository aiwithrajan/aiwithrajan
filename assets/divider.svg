<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12">
  <defs>
    <linearGradient id="quantumLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffa3" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00ffa3" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#9d4edd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00ffa3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Line -->
  <rect x="50" y="5" width="1100" height="2" rx="1" fill="url(#quantumLine)"/>

  <!-- Animated Traveling Photon -->
  <rect y="4" width="140" height="4" rx="2" fill="url(#beam)">
    <animate attributeName="x" values="-140;1200" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Center Diamond Reticle -->
  <polygon points="600,1 606,6 600,11 594,6" fill="#00ffa3" />
  <circle cx="600" cy="6" r="1.5" fill="#04060d"/>
</svg>
